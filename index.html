<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cubes Adventure Knight Calculator</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <div class="page">

        <!-- BACKGROUND CUBES -->
        <div class="cube cube-1"></div>
        <div class="cube cube-2"></div>
        <div class="cube cube-3"></div>


        <!-- HEADER -->
        <header>

            <div class="brand">

                <div class="brand-icon">
                    ◆
                </div>

                <div>
                    <h1>CUBES ADVENTURE</h1>
                    <p>KNIGHT CALCULATOR</p>
                </div>

            </div>

            <div class="top-buttons">

                <button id="themeBtn" aria-label="Ganti tema">
                    ☀
                </button>

                <button id="soundBtn" aria-label="Suara">
                    🔇
                </button>

            </div>

        </header>


        <!-- CALCULATOR -->
        <main class="calculator">

            <!-- TITLE -->

            <div class="calculator-title">

                <div>
                    <span>FUTURISTIC MATH CORE</span>
                    <h2>Calculator</h2>
                </div>

                <select id="mode">

                    <option value="basic">
                        BASIC
                    </option>

                    <option value="scientific">
                        SCIENTIFIC
                    </option>

                </select>

            </div>


            <!-- DISPLAY -->

            <div class="display">

                <div
                    id="expression"
                    class="expression">
                </div>

                <div
                    id="display"
                    class="display-number">

                    0

                </div>

            </div>


            <!-- MEMORY -->

            <div class="memory">

                <button onclick="memoryClear()">MC</button>
                <button onclick="memoryRecall()">MR</button>
                <button onclick="memoryAdd()">M+</button>
                <button onclick="memorySubtract()">M-</button>
                <button onclick="memoryStore()">MS</button>

            </div>


            <!-- SCIENTIFIC -->

            <div
                id="scientific"
                class="scientific hidden">

                <button onclick="scientific('sqrt')">
                    √
                </button>

                <button onclick="scientific('square')">
                    x²
                </button>

                <button onclick="scientific('inverse')">
                    1/x
                </button>

                <button onclick="scientific('sin')">
                    sin
                </button>

                <button onclick="scientific('cos')">
                    cos
                </button>

                <button onclick="scientific('tan')">
                    tan
                </button>

                <button onclick="scientific('log')">
                    log
                </button>

                <button onclick="scientific('ln')">
                    ln
                </button>

                <button onclick="scientific('pi')">
                    π
                </button>

                <button onclick="scientific('e')">
                    e
                </button>

            </div>


            <!-- KEYPAD -->

            <div class="keypad">

                <button
                    class="function"
                    onclick="clearCalculator()">

                    AC

                </button>

                <button
                    class="function"
                    onclick="backspace()">

                    ⌫

                </button>

                <button
                    class="function"
                    onclick="percentage()">

                    %

                </button>

                <button
                    class="operator"
                    onclick="operatorInput('/')">

                    ÷

                </button>


                <button onclick="numberInput('7')">
                    7
                </button>

                <button onclick="numberInput('8')">
                    8
                </button>

                <button onclick="numberInput('9')">
                    9
                </button>

                <button
                    class="operator"
                    onclick="operatorInput('*')">

                    ×

                </button>


                <button onclick="numberInput('4')">
                    4
                </button>

                <button onclick="numberInput('5')">
                    5
                </button>

                <button onclick="numberInput('6')">
                    6
                </button>

                <button
                    class="operator"
                    onclick="operatorInput('-')">

                    −

                </button>


                <button onclick="numberInput('1')">
                    1
                </button>

                <button onclick="numberInput('2')">
                    2
                </button>

                <button onclick="numberInput('3')">
                    3
                </button>

                <button
                    class="operator"
                    onclick="operatorInput('+')">

                    +

                </button>


                <button
                    class="zero"
                    onclick="numberInput('0')">

                    0

                </button>

                <button onclick="numberInput('.')">
                    .
                </button>

                <button onclick="negative()">
                    ±
                </button>

                <button
                    class="equal"
                    onclick="calculate()">

                    =

                </button>

            </div>


            <!-- BOTTOM -->

            <div class="bottom">

                <span>
                    ⌨ Keyboard Ready
                </span>

                <span>
                    ● ONLINE
                </span>

            </div>

        </main>


        <!-- HISTORY BUTTON -->

        <button
            class="history-button"
            onclick="showHistory()">

            🕘 History

        </button>


        <!-- HISTORY -->

        <div
            id="historyModal"
            class="modal">

            <div class="modal-content">

                <div class="modal-title">

                    <h3>
                        Adventure History
                    </h3>

                    <button onclick="closeHistory()">
                        ×
                    </button>

                </div>

                <div id="historyList"></div>

                <button
                    class="clear-history"
                    onclick="deleteHistory()">

                    Clear History

                </button>

            </div>

        </div>


        <!-- TOAST -->

        <div
            id="toast"
            class="toast">
        </div>


    </div>


    <script src="./script.js"></script>

</body>
</html>
