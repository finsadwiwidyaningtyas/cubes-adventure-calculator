<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cubes Adventure Knight - Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Background Cube -->
    <div class="cube cube1"></div>
    <div class="cube cube2"></div>
    <div class="cube cube3"></div>

    <!-- HEADER -->
    <header>

        <!-- LOGO -->
        <div class="logo-container">

            <img src="logo-sekolah.jpeg" class="logo-img" alt="Logo SMKN 1 Sanden">

            <div class="logo-tengah">
                <div class="logo">
                    <span>◆</span>
                    CUBES
                </div>

                <div class="subtitle">
                    ADVENTURE KNIGHT
                </div>
            </div>

            <img src="logo-rpl.jpeg" class="logo-img" alt="Logo RPL">

        </div>

        <!-- LOGO MOKO -->
        <div class="moko-logo">
            <img src="logo-moko.jpeg" alt="MOKO Game Development">
        </div>

    </header>


    <!-- CALCULATOR -->
    <main class="calculator">

        <div class="status">
            <span>● SYSTEM ONLINE</span>
            <span>ENERGY 100%</span>
        </div>

        <!-- Display -->
        <div class="display">

            <div id="history">
                READY FOR CALCULATION
            </div>

            <div id="result">
                0
            </div>

        </div>


        <!-- Buttons -->
        <div class="buttons">

            <!-- Scientific Buttons -->
            <button class="special" onclick="squareRoot()">√</button>
            <button class="special" onclick="squareNumber()">x²</button>
            <button class="special" onclick="inverseNumber()">1/x</button>
            <button class="special" onclick="plusMinus()">±</button>

            <button class="special" onclick="addPi()">π</button>

            <button class="special" onclick="clearDisplay()">AC</button>
            <button class="special" onclick="deleteNumber()">DEL</button>
            <button class="operator" onclick="addNumber('%')">%</button>
            <button class="operator" onclick="addNumber('/')">÷</button>

            <button onclick="addNumber('7')">7</button>
            <button onclick="addNumber('8')">8</button>
            <button onclick="addNumber('9')">9</button>
            <button class="operator" onclick="addNumber('*')">×</button>

            <button onclick="addNumber('4')">4</button>
            <button onclick="addNumber('5')">5</button>
            <button onclick="addNumber('6')">6</button>
            <button class="operator" onclick="addNumber('-')">−</button>

            <button onclick="addNumber('1')">1</button>
            <button onclick="addNumber('2')">2</button>
            <button onclick="addNumber('3')">3</button>
            <button class="operator" onclick="addNumber('+')">+</button>

            <button onclick="addNumber('0')" class="zero">0</button>
            <button onclick="addNumber('.')">.</button>
            <button class="equal" onclick="calculate()">=</button>

        </div>


        <!-- Knight Info -->
        <div class="knight-info">
            <div>⚔ KNIGHT CALCULATOR</div>
            <div>CALCULATION MODE: ACTIVE</div>
        </div>

    </main>


    <!-- NAMA KELOMPOK -->
    <section class="kelompok">

        <h2>TEAM PROJECT</h2>

        <div class="anggota">
            <div class="member">
                <span>01</span>
                Finsa Dwi W.T
            </div>

            <div class="member">
                <span>02</span>
                Talitha Nur S
            </div>

            <div class="member">
                <span>03</span>
                Nazwa Agustina R
            </div>

            <div class="member">
                <span>04</span>
                Aulia Putri M
            </div>
        </div>

    </section>


    <footer>
        CUBES ADVENTURE KNIGHT
        <br>
        Futuristic Calculator
        <br>
        <small>SMKN 1 SANDEN • RPL</small>
    </footer>


    <script src="script.js"></script>

</body>
</html>
