<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cubes Adventures Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game-bg">
        <div class="cube cube1"></div>
        <div class="cube cube2"></div>
        <div class="cube cube3"></div>
        <div class="cube cube4"></div>

        <main class="calculator">

            <div class="game-title">
                <span>🧊</span>
                <div>
                    <h1>CUBES</h1>
                    <p>ADVENTURES</p>
                </div>
                <span>⚔️</span>
            </div>

            <div class="level">
                ⭐ LEVEL 01 • CALCULATOR QUEST ⭐
            </div>

            <div class="display-box">
                <div id="history"></div>
                <div id="display">0</div>
            </div>

            <div class="buttons">

                <button class="special" onclick="clearDisplay()">AC</button>
                <button class="special" onclick="deleteNumber()">⌫</button>
                <button class="special" onclick="percentage()">%</button>
                <button class="operator" onclick="chooseOperator('/')">÷</button>

                <button onclick="appendNumber('7')">7</button>
                <button onclick="appendNumber('8')">8</button>
                <button onclick="appendNumber('9')">9</button>
                <button class="operator" onclick="chooseOperator('*')">×</button>

                <button onclick="appendNumber('4')">4</button>
                <button onclick="appendNumber('5')">5</button>
                <button onclick="appendNumber('6')">6</button>
                <button class="operator" onclick="chooseOperator('-')">−</button>

                <button onclick="appendNumber('1')">1</button>
                <button onclick="appendNumber('2')">2</button>
                <button onclick="appendNumber('3')">3</button>
                <button class="operator" onclick="chooseOperator('+')">+</button>

                <button class="zero" onclick="appendNumber('0')">0</button>
                <button onclick="appendNumber('.')">.</button>
                <button class="equals" onclick="calculate()">=</button>

            </div>

            <div class="footer">
                🏆 COMPLETE YOUR CALCULATION QUEST 🏆
            </div>

        </main>
    </div>

    <script src="script.js"></script>

</body>
</html>
